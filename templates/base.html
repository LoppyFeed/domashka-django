{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Учебный блог{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="{% url 'blog:home' %}">Domashka Blog</a>
        <nav class="nav">
            <a href="{% url 'blog:home' %}">Главная</a>
            <a href="{% url 'blog:about' %}">О блоге</a>
            <a href="{% url 'blog:reviews' %}">Отзывы</a>
            <a href="{% url 'admin:index' %}">Админка</a>
        </nav>
    </div>
</header>

<main class="container">
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="message {{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
